<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard Table</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            background-color: #111111;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border: 1px solid #00ffcc;
        }
        th {
            background-color: #003322;
            font-size: 18px;
            text-transform: uppercase;
            color: #ffffff;
        }
        tr:hover {
            background-color: #002211;
            transition: 0.3s;
        }
        .status-high {
            color: #ff3333;
            font-weight: bold;
        }
        .status-safe {
            color: #33ff33;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Target Module</th>
            <th>Vulnerability Level</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>Web Server (Ubuntu)</td>
            <td class="status-safe">Low</td>
            <td>Secured</td>
        </tr>
        <tr>
            <td>Kali Linux Terminal</td>
            <td class="status-safe">None</td>
            <td>Active</td>
        </tr>
        <tr>
            <td>ESP32 Hardware Node</td>
            <td class="status-high">Critical</td>
            <td>Patch Required</td>
        </tr>
        <tr>
            <td>Database Encryption</td>
            <td class="status-safe">Low</td>
            <td>Monitored</td>
        </tr>
    </table>

</body>
</html>
